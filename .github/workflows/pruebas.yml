name: Pruebas sin despliegue
on:
  push:
    branches: ['pruebas/**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: node tests/regressions.cjs
      - run: node tests/branding.cjs
      - run: npm run build
      - run: node tests/autofact-links-browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: capturas-autofact
          path: .tools/autofact-card-*.png
