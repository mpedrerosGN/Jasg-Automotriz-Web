<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Revisar Autofact</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#e9edf2;font-family:system-ui,sans-serif;color:#172033}header{position:sticky;top:0;background:#fff;z-index:2;padding:8px;display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:8px;border-bottom:1px solid #d5dce6}button{min-height:44px;border:1px solid #d5dce6;border-radius:8px;background:#fff;padding:8px 12px;color:#172033;cursor:pointer}button:disabled{opacity:.45}#status{text-align:center;padding:8px;margin:0;font-size:14px}#stage{padding:12px;overflow:auto;max-height:calc(100dvh - 120px)}canvas{display:block;margin:auto;background:white;box-shadow:0 2px 10px #0002}details{padding:12px;background:white;margin:12px}#text{white-space:pre-wrap;font-size:14px;line-height:1.6}button:focus-visible{outline:3px solid #c58a12}#page{font-size:14px;min-width:90px;text-align:center}
</style></head><body>
<header aria-label="Controles del PDF"><button id="prev" disabled aria-label="Página anterior">←</button><span id="page" aria-live="polite">Cargando…</span><button id="next" disabled aria-label="Página siguiente">→</button><button id="minus" disabled aria-label="Reducir zoom">−</button><button id="fit" disabled>Ajustar</button><button id="plus" disabled aria-label="Aumentar zoom">+</button></header>
<p id="status" role="status" aria-live="polite">Cargando informe Autofact…</p><div id="stage"><canvas id="canvas" aria-label="Página del informe Autofact"></canvas></div><details><summary>Texto de la página (accesibilidad)</summary><div id="text"></div></details>
<script type="module" src="/autofact-viewer.mjs"></script></body></html>
