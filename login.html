<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Acceso | JASG Automotriz</title>
<style>
:root{font-family:Arial,sans-serif}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:linear-gradient(135deg,#111 0%,#242424 48%,#b88316 140%)}.login-card{width:min(100%,440px);padding:34px;background:#fff;border:1px solid #d4a72c;border-radius:22px;box-shadow:0 20px 60px #0008}.brand{text-align:center;margin-bottom:26px}.brand-mark{width:118px;height:88px;margin:0 auto 14px;display:block;object-fit:contain;border-radius:12px}h1{margin:0;color:#171717;font-size:25px}.subtitle{margin:8px 0 0;color:#6b7280;font-size:14px}label{display:block;margin:16px 0 7px;color:#171717;font-size:13px;font-weight:700}input,button{width:100%;min-height:46px;border-radius:10px;font:inherit}input{padding:0 13px;border:1px solid #c9b57b;background:#fffdf7;color:#171717}input:focus{outline:2px solid #d4a72c;border-color:#b88316}button{margin-top:22px;border:0;background:linear-gradient(90deg,#b88316,#d4a72c);color:#171717;cursor:pointer;font-weight:700}button:disabled{opacity:.7;cursor:wait}#login-error{min-height:20px;margin:14px 0 0;color:#b42318;text-align:center;font-size:13px}
</style></head>
<body><main class="login-card"><div class="brand"><img class="brand-mark" src="assets/jasg-logo.jpeg" alt="JASG Automotriz"><h1>JASG Automotriz</h1><p class="subtitle">Acceso al sistema</p></div><form id="login-form"><label for="login-user">Usuario o correo</label><input id="login-user" value="demo" autocomplete="username" required><label for="login-password">Contraseña</label><input id="login-password" type="password" autocomplete="current-password" required><button id="login-button" type="submit">Ingresar</button><p id="login-error" role="alert"></p></form></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-client.js?v=4"></script><script>(function(){const f=document.getElementById('login-form'),b=document.getElementById('login-button'),e=document.getElementById('login-error');f.addEventListener('submit',async function(x){x.preventDefault();e.textContent='';if(!window.jasgSupabase){e.textContent='No se pudo conectar con el servidor.';return}b.disabled=true;const u=document.getElementById('login-user').value.trim(),p=document.getElementById('login-password').value,r=await window.jasgSupabase.auth.signInWithPassword({email:u.includes('@')?u:u+'@jasg.cl',password:p});b.disabled=false;if(r.error){e.textContent='Usuario o contraseña incorrectos.';return}location.href='admin.html'})}());</script></body></html>
